# X11 para BQ E4.5 mainline: fbdev sobre simplefb (540x960 RGB565) + tactil evdev.
# Dispositivos EXPLICITOS (AutoAddDevices off) -> no necesita udev/eudev.
Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "DontZap"        "false"
EndSection

Section "Device"
    Identifier  "fb"
    Driver      "fbdev"
    Option      "fbdev"    "/dev/fb0"
    Option      "ShadowFB" "true"
EndSection

Section "Monitor"
    Identifier "mon"
EndSection

Section "Screen"
    Identifier  "scr"
    Device      "fb"
    Monitor     "mon"
    DefaultDepth 16
    SubSection "Display"
        Depth 16
    EndSubSection
EndSection

Section "InputDevice"
    Identifier  "touch"
    Driver      "evdev"
    Option      "Device"      "/dev/input/event0"
    Option      "CorePointer" "true"
EndSection

Section "ServerLayout"
    Identifier  "layout"
    Screen      "scr"
    InputDevice "touch"
EndSection
